name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore CoreWcf.ConfigTransformer.sln
      - run: dotnet build CoreWcf.ConfigTransformer.sln --configuration Release --no-restore
      - run: dotnet test CoreWcf.ConfigTransformer.sln --configuration Release --no-build
